<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Classroom</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            overflow: hidden;
        }

        /* 主体双栏布局：左侧列表 + 右侧播放器 */
        .main-container {
            height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 12px;
            padding: 12px;
            max-width: 1920px;
            margin: 0 auto;
        }

        /* 左侧视频库 */
        .left-panel {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-header {
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .panel-header-icon {
            margin-right: 7px;
        }

        .series-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .series-item {
            margin-bottom: 5px;
        }

        .series-header {
            min-height: 40px;
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .series-header:hover {
            background: #f5f8fc;
        }

        .series-arrow {
            width: 20px;
            color: #777;
            font-size: 12px;
            transition: transform 0.15s;
        }

        .series-arrow.open {
            transform: rotate(90deg);
        }

        .series-name {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .series-count {
            font-size: 11px;
            color: #999;
            margin-left: 5px;
        }

        .video-list {
            display: none;
            padding: 0 0 4px 20px;
        }

        .video-list.open {
            display: block;
        }

        .video-item {
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 2px;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
            transition: all 0.15s;
            position: relative;
        }

        .video-item:hover {
            background: #f5f8fc;
            color: #1677ff;
        }

        .video-item.active {
            background: #e6f4ff;
            color: #1677ff;
            font-weight: 600;
        }

        .video-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            bottom: 7px;
            width: 3px;
            border-radius: 2px;
            background: #1677ff;
        }

        .video-id {
            font-size: 10px;
            color: #aaa;
            margin-top: 3px;
            font-weight: normal;
            word-break: break-all;
        }

        /* 右侧主播放器容器 */
        .video-container {
            flex: 1;
            height: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        #youtube-player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #youtube-player iframe {
            width: 100% !important;
            height: 100% !important;
        }

        .loading, .empty {
            padding: 20px 10px;
            text-align: center;
            color: #aaa;
            font-size: 13px;
        }

        .error {
            padding: 12px;
            margin: 8px;
            color: #cf1322;
            background: #fff1f0;
            border: 1px solid #ffa39e;
            border-radius: 6px;
            font-size: 12px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
            }
            .main-container {
                height: auto;
                display: flex;
                flex-direction: column-reverse;
                padding: 8px;
            }
            .video-container {
                height: 55vh;
                min-height: 280px;
            }
            .left-panel {
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

<div class="main-container">
    <!-- 左侧：系列与视频列表 -->
    <div class="left-panel">
        <div class="panel-header">
            <span class="panel-header-icon">📚</span> Video Library
        </div>
        <div class="series-list" id="seriesList">
            <div class="loading">Loading videos...</div>
        </div>
    </div>

    <!-- 右侧：播放器主体 -->
    <div class="video-container">
        <div id="youtube-player"></div>
    </div>
</div>

<script>
const GITHUB_USER = "zirconpl";
const GITHUB_REPO = "zirconpl.github.io";
const GITHUB_BRANCH = "main";
const ID_FOLDER = "id";

const GITHUB_API_ROOT =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ID_FOLDER}?ref=${GITHUB_BRANCH}`;

const seriesList = document.getElementById("seriesList");

let player = null;
let youtubeApiReady = false;
let currentVideoId = null;
const expandedSeries = new Set();

function loadYouTubeAPI() {
    return new Promise((resolve) => {
        if (window.YT && window.YT.Player) {
            youtubeApiReady = true;
            resolve();
            return;
        }
        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        window.onYouTubeIframeAPIReady = function () {
            youtubeApiReady = true;
            resolve();
        };
        document.head.appendChild(script);
    });
}

async function init() {
    try {
        await loadYouTubeAPI();
        await loadSeriesList();
    } catch (error) {
        console.error(error);
        seriesList.innerHTML = `
            <div class="error">
                Failed to load the video library:<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}

async function loadSeriesList() {
    const response = await fetch(GITHUB_API_ROOT, { cache: "no-store" });
    if (!response.ok) {
        throw new Error(`GitHub API request failed: ${response.status}`);
    }

    const entries = await response.json();
    const directories = entries
        .filter(item => item.type === "dir")
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

    if (directories.length === 0) {
        seriesList.innerHTML = `<div class="empty">No series folders found.</div>`;
        return;
    }

    seriesList.innerHTML = "";
    const seriesData = await Promise.all(
        directories.map(async directory => ({
            directory,
            videos: await loadSeriesVideos(directory.name)
        }))
    );

    seriesData.forEach(data => {
        renderSeries(data.directory.name, data.videos);
    });
}

async function getFileCreatedTime(filePath) {
    try {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/commits?path=${encodeURIComponent(filePath)}&sha=${GITHUB_BRANCH}&per_page=100`;
        const res = await fetch(url);
        if (!res.ok) return 0;
        const commits = await res.json();
        if (Array.isArray(commits) && commits.length > 0) {
            const firstCommit = commits[commits.length - 1];
            return new Date(firstCommit.commit.committer.date).getTime();
        }
    } catch (e) {
        console.warn(`Failed to fetch commit date for ${filePath}:`, e);
    }
    return 0;
}

async function loadSeriesVideos(seriesName) {
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${ID_FOLDER}/${encodeURIComponent(seriesName)}?ref=${GITHUB_BRANCH}`;
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(`Unable to load series ${seriesName}`);

    const files = await response.json();
    const jsonFiles = files.filter(
        file => file.type === "file" && file.name.toLowerCase().endsWith(".json")
    );

    const videos = await Promise.all(
        jsonFiles.map(async file => {
            const videoId = file.name.replace(/\.json$/i, "");
            const filePath = `${ID_FOLDER}/${seriesName}/${file.name}`;

            const [configRes, createdTime] = await Promise.all([
                fetch(`./id/${encodeURIComponent(seriesName)}/${encodeURIComponent(file.name)}`, { cache: "no-store" }).catch(() => null),
                getFileCreatedTime(filePath)
            ]);

            let title = videoId;
            if (configRes && configRes.ok) {
                try {
                    const config = await configRes.json();
                    title = config.title || videoId;
                } catch (e) {
                    console.error(`Parse JSON failed: ${file.name}`);
                }
            }

            return {
                videoId,
                fileName: file.name,
                title,
                createdTime
            };
        })
    );

    videos.sort((a, b) => a.createdTime - b.createdTime);
    return videos;
}

function renderSeries(seriesName, videos) {
    const seriesItem = document.createElement("div");
    seriesItem.className = "series-item";

    const header = document.createElement("div");
    header.className = "series-header";

    const arrow = document.createElement("span");
    arrow.className = "series-arrow";
    arrow.textContent = "▶";

    const name = document.createElement("span");
    name.className = "series-name";
    name.textContent = formatSeriesName(seriesName);

    const count = document.createElement("span");
    count.className = "series-count";
    count.textContent = videos.length;

    header.appendChild(arrow);
    header.appendChild(name);
    header.appendChild(count);

    const videoList = document.createElement("div");
    videoList.className = "video-list";

    videos.forEach(video => {
        const item = createVideoItem(seriesName, video);
        videoList.appendChild(item);
    });

    header.onclick = () => {
        const isOpen = videoList.classList.contains("open");
        if (isOpen) {
            videoList.classList.remove("open");
            arrow.classList.remove("open");
            expandedSeries.delete(seriesName);
        } else {
            videoList.classList.add("open");
            arrow.classList.add("open");
            expandedSeries.add(seriesName);
        }
    };

    seriesItem.appendChild(header);
    seriesItem.appendChild(videoList);
    seriesList.appendChild(seriesItem);
}

function createVideoItem(seriesName, video) {
    const item = document.createElement("div");
    item.className = "video-item";
    item.dataset.videoId = video.videoId;
    item.dataset.series = seriesName;

    item.innerHTML = `
        <div>${escapeHtml(video.title)}</div>
        <div class="video-id">${escapeHtml(video.videoId)}</div>
    `;

    item.onclick = () => loadVideo(seriesName, video);
    return item;
}

async function loadVideo(seriesName, video) {
    currentVideoId = video.videoId;

    document.querySelectorAll(".video-item").forEach(item => {
        item.classList.toggle("active", item.dataset.videoId === video.videoId);
    });

    document.title = `${video.title} - English Learning Classroom`;
    await loadYouTubeVideo(video.videoId);
}

function loadYouTubeVideo(videoId) {
    return new Promise(resolve => {
        if (!youtubeApiReady) {
            resolve();
            return;
        }

        if (!player) {
            player = new YT.Player("youtube-player", {
                videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 1,       // 允许老师使用原生控制栏（如果需要）
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    iv_load_policy: 3
                },
                events: {
                    onReady: () => resolve()
                }
            });
        } else {
            player.loadVideoById(videoId);
            resolve();
        }
    });
}

function formatSeriesName(name) {
    const map = {
        "pororo": "Pororo",
        "peppa-pig": "Peppa Pig",
        "peppa": "Peppa Pig",
        "labrador": "Sheriff Labrador"
    };
    return map[name] || name;
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

/* 键盘操作：空格暂停/播放，左右方向键快进/快退 1 秒 */
window.addEventListener("keydown", event => {
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
        return;
    }
    if (!player || typeof player.getPlayerState !== "function") {
        return;
    }

    if (event.code === "Space" || event.keyCode === 32) {
        event.preventDefault();
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
        return;
    }

    if (event.code === "ArrowLeft" || event.code === "ArrowRight") {
        event.preventDefault();
        const currentTime = player.getCurrentTime();
        const step = 1.0;
        let newTime = event.code === "ArrowLeft" 
            ? Math.max(0, currentTime - step)
            : Math.min(player.getDuration(), currentTime + step);
        player.seekTo(newTime, true);
    }
});

init();
</script>

</body>
</html>
